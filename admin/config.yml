backend:
  name: git-gateway
  branch: 48891

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "posts"
    label: "Post"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Contenuto", name: "body", widget: "markdown"}

  - name: "incarico_formale"
    label: "Incarico Formale"
    folder: "_incarico_formale"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Nome", name: "name", widget: "string"}
      - {label: "Incarico", name: "incarico", widget: "string"}
      - {label: "Tipo di Incarico", name: "tipo_incarico", widget: "string"}
      - {label: "Data Insediamento", name: "data_insediamento", widget: "date"}
      - label: "Organizzazione"
        name: "organizzazione"
        widget: "list"
        fields:
          - {label: "Nome", name: "nome", widget: "string"}
          - {label: "Link", name: "link", widget: "string"}
          - {label: "Ruolo", name: "ruolo", widget: "string"}
      - {label: "Contenuto", name: "body", widget: "markdown"}

  - name: "sites"
    label: "Mini-siti"
    folder: "sites"
    create: true
    path: "{{slug}}/index"
    slug: "{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Contenuto", name: "body", widget: "markdown"}

  - name: "navbar"
    label: "Navbar"
    files:
      - label: "Menu principale"
        name: "nav"
        file: "_data/nav.yml"
        fields:
          - label: "Menu"
            name: "menu"
            widget: "list"
            fields:
              - {label: "Testo", name: "text", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
