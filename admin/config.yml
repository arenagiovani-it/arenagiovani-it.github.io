backend:
  name: git-gateway
  branch: "48891"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "persone_pubbliche"
    label: "Persone Pubbliche"
    folder: "content/persone_pubbliche"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Titolo"
        name: "title"
        widget: "string"
      - label: "Nome"
        name: "nome"
        widget: "string"
      - label: "Ruolo"
        name: "ruolo"
        widget: "string"
      - label: "Foto"
        name: "foto"
        widget: "image"
      - label: "Descrizione"
        name: "descrizione"
        widget: "string"
      - label: "Incarico"
        name: "incarico"
        widget: "string"
      - label: "Data di insediamento"
        name: "data_insediamento"
        widget: "date"
      - label: "Organizzazione"
        name: "organizzazione"
        widget: "list"
        fields:
          - label: "Nome"
            name: "nome"
            widget: "string"
          - label: "Link"
            name: "link"
            widget: "string"
          - label: "Descrizione"
            name: "descrizione"
            widget: "string"
            required: false
      - label: "Competenze"
        name: "competenze"
        widget: "list"
        required: false
      - label: "Contatti"
        name: "contatti"
        widget: "list"
        required: false
      - label: "Documenti"
        name: "documenti"
        widget: "list"
        fields:
          - label: "Nome file"
            name: "nome_file"
            widget: "string"
          - label: "Link"
            name: "link"
            widget: "string"
