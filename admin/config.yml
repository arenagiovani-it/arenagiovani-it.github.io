backend:
  name: git-gateway
  branch: "48891"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "persone_pubbliche"
    label: "Persone Pubbliche"
    folder: "content/persone_pubbliche"
    create: true
    slug: "{{nome | slugify}}-{{cognome | slugify}}"
    extension: "html"
    fields:
      - { label: "Nome", name: "nome", widget: "string", required: true }
      - { label: "Cognome", name: "cognome", widget: "string", required: true }
      - { label: "Ruolo", name: "ruolo", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
