backend:
  name: git-gateway
  branch: 48891

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "persone_pubbliche"
    label: "Persone con incarichi pubblici"
    folder: "incarico_formale"
    create: true
    slug: "/persone/c2016/{{slug}}"
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Ruolo", name: "ruolo", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
