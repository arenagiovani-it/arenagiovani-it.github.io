backend:
  name: git-gateway
  branch: 48891  # Cambia se usi un altro branch

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "navbar"
    label: "Navbar"
    files:
      - label: "Menu principale"
        name: "nav"
        file: "_data/nav.yml"
        fields:
          - label: "Menu"
            name: "menu"
            widget: "list"
            fields:
              - label: "Testo"
                name: "text"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"

  - name: "persone_pubbliche"
    label: "Persone Pubbliche"
    folder: "_incarico_formale"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titolo Pagina", name: "title", widget: "string"}
      - {label: "Nome Completo", name: "name", widget: "string"}
      - {label: "Incarico", name: "incarico", widget: "string"}
      - {label: "Tipo di Incarico", name: "tipo_incarico", widget: "string"}
      - {label: "Data Insediamento", name: "data_insediamento", widget: "date"}
      - label: "Organizzazioni"
        name: "organizzazioni"
        widget: "list"
        fields:
          - {label: "Nome Organizzazione", name: "nome", widget: "string"}
          - {label: "Link", name: "link", widget: "string"}
          - {label: "Ruolo", name: "ruolo", widget: "string"}
      - {label: "Competenze / Deleghe", name: "competenze", widget: "text"}
      - {label: "Email Contatto", name: "email", widget: "string"}
      - {label: "Immagine Profilo", name: "image", widget: "image", required: false}
      - {label: "Contenuto pagina", name: "body", widget: "markdown"}

  - name: "organi"
    label: "Organi"
    folder: "_organi"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome Organo", name: "nome", widget: "string"}
      - {label: "Descrizione", name: "descrizione", widget: "markdown"}
      - label: "Persone Associate"
        name: "persone_assoc"
        widget: "list"
        fields:
          - {label: "Nome Persona", name: "nome_persona", widget: "string"}
          - {label: "Ruolo", name: "ruolo", widget: "string"}
          - {label: "Link Profilo", name: "link_profilo", widget: "string", required: false}
